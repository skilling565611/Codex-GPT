[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-gpt"
version = "0.1.0"
description = "Workspace for Codex and GPT experiments."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
  { name = "skilling565611" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
